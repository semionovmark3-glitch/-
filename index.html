<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ВНИМАНИЕ! СИСТЕМНЫЙ СБОЙ</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #0c0707; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            color: #ff3b30; overflow: hidden; user-select: none; cursor: pointer;
        }
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.12; }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 2; text-align: center; padding: 20px;
        }
        #start-screen { background: #121214; }
        #hack-screen { display: none; background: radial-gradient(circle, #240c0c 0%, #030101 100%); }
        
        h1 { font-size: 46px; text-shadow: 0 0 20px rgba(255, 59, 48, 0.6); margin-bottom: 10px; animation: blink 1.2s infinite; font-weight: 900; letter-spacing: -1px; }
        p { font-size: 22px; color: #a4a4aa; max-width: 600px; line-height: 1.5; }
        .click-prompt { font-size: 16px; color: #ff3b30; margin-top: 40px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        
        /* Большие карточки с собакой */
        .dog-card {
            position: absolute; 
            width: 480px; 
            background: #1c1c1e; 
            border: 2px solid #ff3b30;
            border-radius: 20px; 
            padding: 16px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255,59,48,0.2);
            z-index: 100; 
            display: none; 
            text-align: center;
            transform: scale(0); 
            animation: popOpen 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .img-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 1px solid #2c2c2e;
        }
        
        .dog-img { 
            width: 100%; 
            height: auto; 
            display: block;
        }
        
        .dog-text { 
            color: #fff; 
            font-size: 26px; 
            font-weight: 800; 
            margin-top: 16px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); 
        }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes popOpen { to { transform: scale(1); } }
    </style>
</head>
<!-- Клик в ЛЮБОЕ место экрана теперь запускает пранк -->

        <p>Выполняется проверка конфигурации безопасности вашего интернет-браузера.</p>
        <div class="click-prompt">Кликните в любом месте экрана для продолжения...</div>

    <script>
        let audioCtx;
        let prankStarted = false;

        function playPopSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.25);
            
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function startPrank() {
            if (prankStarted) return; // Чтобы повторные клики не перезапускали таймеры
            prankStarted = true;

            // Запрос полноэкранного режима для маскировки интерфейса браузера
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

            // Переключение экранов
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hack-screen').style.display = 'flex';
            
            startBackgroundEffects();
            
            // Бесконечное появление окон
            setInterval(() => {
                spawnDogWindow();
                playPopSound();
            }, 400); 
        }

        function spawnDogWindow() {
            const template = document.getElementById('dog-template');
            const clone = template.cloneNode(true);
            clone.removeAttribute('id');
            clone.style.display = 'block';
            
            // Расчет позиций
            const x = Math.random() * (window.innerWidth - 500);
            const y = Math.random() * (window.innerHeight - 520);
            clone.style.left = Math.max(10, x) + 'px';
            clone.style.top = Math.max(10, y) + 'px';
            
            // Небольшой случайный поворот окон для большего хаоса
            const tilt = (Math.random() - 0.5) * 16; 
            clone.style.transform = `rotate(${tilt}deg)`;
            
            document.body.appendChild(clone);
        }

        function startBackgroundEffects() {
            const canvas = document.getElementById('matrix-bg');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const alphabet = "01MAX01";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const rainDrops = Array.from({ length: columns }).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(12, 7, 7, 0.06)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3b30';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < rainDrops.length; i++) {
                    const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
